<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>舊生加選 / 新增預約課程 - MusiMate</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- LINE LIFF SDK & Database -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../data/musimate_db.js"></script>

    <!-- 100% 內嵌獨立樣式表 (完全避免外部 CSS 檔案 404 遺失問題) -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary-brown: #CEAB98;
            --primary-dark: #2B3049;
            --bg-cream: #FAF6F0;
            --bg-outer: #EAE6DF;
            --card-border: #F0EAE1;
            --text-main: #2B3049;
            --text-muted: #7A736E;
        }

        body {
            background: var(--bg-outer);
            font-family: 'Sora', 'Noto Sans TC', -apple-system, sans-serif;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .mobile-frame {
            width: 375px;
            max-width: 100%;
            min-height: 800px;
            background: var(--bg-cream);
            border-radius: 36px;
            box-shadow: 0px 20px 40px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .status-bar {
            width: 100%;
            height: 44px;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-main);
        }

        .nav-header {
            width: 100%;
            height: 60px;
            padding: 0 20px;
            background: var(--bg-cream);
            border-bottom: 1px solid #F0EBE1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .student-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 20px;
            background: rgba(206, 171, 152, 0.2);
            border: 1px solid var(--primary-brown);
            font-size: 13px;
            font-weight: 700;
            color: #4A3A31;
        }

        .main-content {
            padding: 16px 18px 24px 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            flex: 1;
        }

        .page-header {
            text-align: center;
        }

        .page-title {
            color: var(--primary-brown);
            font-size: 24px;
            font-family: 'Noto Serif TC', serif;
            font-weight: 700;
        }

        .page-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 600;
        }

        /* 彈窗樣式 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
            animation: fadeIn 0.2s ease-out;
        }

        .modal-card {
            width: 100%;
            max-width: 350px;
            background: white;
            box-shadow: 0px 16px 36px rgba(0, 0, 0, 0.25);
            border-radius: 24px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            animation: scaleIn 0.25s ease-out;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .field-label {
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 700;
        }

        .field-select, .field-input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1.5px solid #EFECE6;
            background: #FDFBF7;
            color: var(--text-main);
            font-size: 13px;
            font-weight: 600;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .field-select:focus, .field-input:focus {
            border-color: var(--primary-brown);
            background: white;
        }

        .btn-submit-modal {
            width: 100%;
            padding: 12px;
            background: var(--primary-brown);
            color: white;
            font-weight: 800;
            font-size: 14px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(206, 171, 152, 0.4);
            transition: background 0.2s;
        }

        .btn-submit-modal:hover {
            background: #BA9682;
        }

        .btn-cancel-modal {
            width: 100%;
            padding: 10px;
            background: #FAF6F0;
            color: #6F6F6F;
            font-weight: 700;
            font-size: 13px;
            border-radius: 12px;
            border: 1px solid #EFECE6;
            cursor: pointer;
            text-align: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes scaleIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<!-- 底層學生課表背景 (符合隱私規範，僅呈現學生個人排程) -->
<div class="mobile-frame" style="opacity: 0.35; pointer-events: none;">
    <div class="status-bar">
        <span>9:41</span>
        <span>📶 🔋</span>
    </div>
    <div class="nav-header">
        <div class="brand-logo">
            <img src="../../UI/logo.png" alt="MusiMate" style="height: 36px; object-fit: contain;" onerror="this.src='https://lin05141021.github.io/test_musimate/UI/logo.png'" />
        </div>
        <span id="bgStudentTag" class="student-pill">載入中...</span>
    </div>
    <div class="main-content">
        <div class="page-header"><h1 class="page-title">我的課表</h1><p class="page-subtitle">林佩芬 老師 · 預約課堂清單</p></div>
    </div>
</div>

<!-- 新增課程 Modal 彈窗 -->
<div class="modal-overlay">
    <div class="modal-card">
        <!-- 彈窗頂部標題與 Logo -->
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #F0EBE1; padding-bottom: 8px;">
            <div style="display: flex; align-items: center; gap: 8px;">
                <img src="../../UI/logo.png" alt="MusiMate" style="height: 28px; object-fit: contain;" onerror="this.src='https://lin05141021.github.io/test_musimate/UI/logo.png'" />
                <div style="color: #2B3049; font-size: 16px; font-weight: 800; font-family: 'Noto Serif TC', serif;">加選 / 預約新課程</div>
            </div>
            <button onclick="handleCancel()" style="width: 28px; height: 28px; background: #FAF6F0; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #2B3049;">
                ✕
            </button>
        </div>

        <!-- 已繳費剩餘時數提示卡片 -->
        <div id="remainingHoursCard" style="padding: 8px 12px; background: #FFF8E1; border: 1px solid #FFE082; border-radius: 12px; display: flex; align-items: center; justify-content: space-between;">
            <div style="display: flex; align-items: center; gap: 6px;">
                <span style="font-size: 15px;">🎟️</span>
                <span style="color: #E65100; font-size: 11px; font-weight: 700;">已繳費未排時數：</span>
            </div>
            <span id="remainingHoursDisplay" style="color: #E65100; font-size: 13px; font-weight: 800;">0 小時</span>
        </div>

        <!-- 表單欄位 -->
        <div style="display: flex; flex-direction: column; gap: 10px;">
            <div class="field-group">
                <label class="field-label">預約學員</label>
                <select id="studentSelect" class="field-select" onchange="updateStudentInfo(this.value)">
                    <!-- JS 動態填入 -->
                </select>
            </div>

            <div class="field-group">
                <label class="field-label">課程類型</label>
                <select class="field-select" id="courseTypeSelect">
                    <option value="piano" selected>個別古典鋼琴課 (2小時)</option>
                    <option value="violin">小提琴演奏精修課 (1小時)</option>
                    <option value="theory">音樂理論與聽寫視唱 (1小時)</option>
                </select>
            </div>

            <div class="field-group">
                <label class="field-label">上課時段 (林佩芬老師開放時段)</label>
                <select class="field-select" id="timeSlotSelect">
                    <!-- JS 動態填入開放時段 -->
                </select>
            </div>

            <div class="field-group">
                <label class="field-label">付款方式與時數折抵</label>
                <select class="field-select" id="paymentMethodSelect">
                    <option value="postpaid" selected>💳 單堂現金/轉帳 (完課後付 $3,200)</option>
                    <option value="prepaid_10">📦 預付 10 堂期繳 (享雙軌履約保證)</option>
                    <option value="use_hours" id="optUseHours" disabled>🎟️ 使用已繳費剩餘時數折抵</option>
                </select>
            </div>
        </div>

        <!-- 按鈕區 -->
        <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 4px;">
            <button class="btn-submit-modal" onclick="handleSubmit()">
                確認送出預約
            </button>
            <button class="btn-cancel-modal" onclick="handleCancel()">
                取消返回課表
            </button>
        </div>
    </div>
</div>

<script>
let currentStudentId = 's-lin';

function updateStudentInfo(studentId) {
    currentStudentId = studentId;
    if (!window.MusiMateDB) return;

    const students = window.MusiMateDB.getStudents();
    const current = students.find(s => s.student_id === studentId || s.id === studentId || s.name === studentId);
    if (current) {
        document.getElementById('bgStudentTag').innerText = current.name;
    }

    const hours = window.MusiMateDB.getRemainingHours(studentId);
    document.getElementById('remainingHoursDisplay').innerText = `${hours} 小時`;

    const optHours = document.getElementById('optUseHours');
    if (hours > 0) {
        optHours.innerText = `🎟️ 使用已繳費剩餘時數折抵 (剩餘 ${hours} 小時)`;
        optHours.disabled = false;
        document.getElementById('paymentMethodSelect').value = 'use_hours';
    } else {
        optHours.innerText = `🎟️ 使用已繳費剩餘時數折抵 (目前 0 小時)`;
        optHours.disabled = true;
        document.getElementById('paymentMethodSelect').value = 'postpaid';
    }
}

function handleSubmit() {
    const courseSelect = document.getElementById('courseTypeSelect');
    const courseText = courseSelect.selectedOptions[0].text;
    const courseVal = courseSelect.value;
    
    const timeSelect = document.getElementById('timeSlotSelect');
    const startTimeIso = timeSelect.value;
    const slotText = timeSelect.selectedOptions[0]?.text || '';
    
    const paymentSelect = document.getElementById('paymentMethodSelect');
    const paymentVal = paymentSelect.value;
    
    if (!startTimeIso) {
        alert('請先選擇上課時段！');
        return;
    }

    const startDate = new Date(startTimeIso);
    const lessonDurationHours = courseVal === 'piano' ? 2 : 1;
    const endDate = new Date(startDate.getTime() + lessonDurationHours * 60 * 60 * 1000);
    
    const y = startDate.getFullYear();
    const m = String(startDate.getMonth() + 1).padStart(2, '0');
    const d = String(startDate.getDate()).padStart(2, '0');
    const sh = String(startDate.getHours()).padStart(2, '0');
    const sm = String(startDate.getMinutes()).padStart(2, '0');
    const eh = String(endDate.getHours()).padStart(2, '0');
    const em = String(endDate.getMinutes()).padStart(2, '0');

    let studentName = '學員';
    if (window.MusiMateDB) {
        const students = window.MusiMateDB.getStudents();
        const cur = students.find(s => s.student_id === currentStudentId || s.id === currentStudentId || s.name === currentStudentId);
        if (cur) studentName = cur.name;
    }

    const isPrepaidOrHours = paymentVal === 'prepaid_10' || paymentVal === 'use_hours';

    const newAppt = {
        student_id: currentStudentId,
        student_name: studentName,
        teacher_id: 'df637b26-7cab-443b-8801-4361fb35afdd',
        teacher_name: '林佩芬 老師',
        start_time: `${y}-${m}-${d}T${sh}:${sm}:00+08:00`,
        end_time: `${y}-${m}-${d}T${eh}:${em}:00+08:00`,
        status: 'confirmed',
        instrument: courseVal === 'violin' ? '小提琴 (Violin)' : (courseVal === 'theory' ? '音樂理論聽寫' : '古典鋼琴 (Piano)'),
        location: '音符琴房 A303',
        payment_status: isPrepaidOrHours ? 'paid' : 'pay_per_lesson',
        payment_type: paymentVal === 'use_hours' ? 'prepaid_hours' : (paymentVal === 'prepaid_10' ? 'prepaid' : 'postpaid'),
        memo_notes: paymentVal === 'use_hours' ? '使用已繳費時數折抵' : ''
    };
    
    if (window.MusiMateDB) {
        window.MusiMateDB.addAppointment(newAppt);

        if (paymentVal === 'use_hours') {
            window.MusiMateDB.deductRemainingHours(currentStudentId, lessonDurationHours);
        }
    }

    alert(`🎉 預約成功！\n\n已為 ${studentName} 成功預約：\n【${courseText}】\n時段：${slotText}\n\n已即時加入課表與資料庫！`);
    location.href = `../test_uiredesign/student_schedule.html?student_id=${encodeURIComponent(currentStudentId)}`;
}

function handleCancel() {
    location.href = `../test_uiredesign/student_schedule.html?student_id=${encodeURIComponent(currentStudentId)}`;
}

function formatSlotOption(startIso, endIso, loc) {
    const d = new Date(startIso);
    const month = d.getMonth() + 1;
    const date = d.getDate();
    const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
    const w = weekdays[d.getDay()];
    const s = new Date(startIso).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
    const e = new Date(endIso).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
    return `${String(month).padStart(2, '0')}/${String(date).padStart(2, '0')} (${w}) ${s} - ${e} (${loc || '音符琴房 A303'})`;
}

document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const queryStudentId = params.get('student_id') || params.get('student') || params.get('name');

    if (window.MusiMateDB) {
        const students = window.MusiMateDB.getStudents();
        const studentSelect = document.getElementById('studentSelect');
        
        let initialStudent = null;
        if (queryStudentId) {
            initialStudent = students.find(s => s.student_id === queryStudentId || s.id === queryStudentId || s.name.includes(queryStudentId));
        }
        if (!initialStudent) {
            initialStudent = students[0];
        }

        if (initialStudent) {
            currentStudentId = initialStudent.student_id || initialStudent.id;
        }

        studentSelect.innerHTML = students.map(s => {
            const isSel = (s.student_id === currentStudentId || s.id === currentStudentId || s.name === currentStudentId);
            return `<option value="${s.student_id || s.id}" ${isSel ? 'selected' : ''}>${s.name} (${s.default_instrument})</option>`;
        }).join('');

        updateStudentInfo(currentStudentId);

        const slots = window.MusiMateDB.getAvailableSlots();
        const timeSelect = document.getElementById('timeSlotSelect');
        if (slots.length > 0) {
            timeSelect.innerHTML = slots.map(s => `
                <option value="${s.start_time}">${formatSlotOption(s.start_time, s.end_time, s.location)}</option>
            `).join('');
        } else {
            timeSelect.innerHTML = '<option value="">目前開放時段已滿，請洽林佩芬老師</option>';
        }
    }
});
</script>

</body>
</html>
