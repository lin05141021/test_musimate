<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>舊生加選 / 新增預約課程 - MusiMate</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- 樣式庫 -->
    <link rel="stylesheet" href="../../UI/style_0824.css">
    <link rel="stylesheet" href="../test_uiredesign/schedule_styles.css">
    <script src="../data/musimate_db.js"></script>
    <style>
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
        }
        .modal-card {
            width: 100%;
            max-width: 400px;
            background: white;
            box-shadow: 0px 12px 32px rgba(0, 0, 0, 0.25);
            border-radius: 24px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            animation: modalFadeIn 0.25s ease-out;
        }
        @keyframes modalFadeIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .field-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .field-label {
            color: #6F6F6F;
            font-size: 13px;
            font-weight: 700;
        }
        .field-select, .field-input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1.5px solid #FAF6F0;
            background: #FDFBF7;
            color: #2B3049;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            box-sizing: border-box;
        }
        .field-select:focus, .field-input:focus {
            border-color: #CEAB98;
            background: white;
        }
        .btn-submit-modal {
            width: 100%;
            padding: 14px;
            background: #CEAB98;
            color: white;
            font-weight: 700;
            font-size: 14px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(206, 171, 152, 0.35);
            transition: background 0.2s;
        }
        .btn-submit-modal:hover {
            background: #BA9682;
        }
        .btn-cancel-modal {
            width: 100%;
            padding: 12px;
            background: #FAF6F0;
            color: #6F6F6F;
            font-weight: 700;
            font-size: 14px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            text-align: center;
        }
    </style>
</head>
<body class="mobile-view">

<!-- 底層學生課表背景 (符合隱私規範，僅呈現學生個人排程) -->
<div class="mobile-frame" style="opacity: 0.4; pointer-events: none;">
    <div class="status-bar">
        <span>9:41</span>
        <span>📶 🔋</span>
    </div>
    <div class="nav-header">
        <div class="brand-logo"><div class="brand-icon">🎵</div><span>MusiMate</span></div>
        <span id="bgStudentTag" style="font-size: 12px; font-weight: bold; color: #7B1FA2; background: #F3E5F5; padding: 4px 10px; border-radius: 12px;">Lin (林同學)</span>
    </div>
    <div class="main-content">
        <div class="page-header"><h1 class="page-title">我的課表</h1><p class="page-subtitle">張老師 · 預約課堂清單</p></div>
        <div class="lesson-item">
            <div class="date-badge"><div class="day-number">8/26</div><div class="day-weekday">(三)</div></div>
            <div class="lesson-card-right"><div class="info-card"><div class="info-card-left"><div class="time-text">10:00 - 12:00</div><div class="course-title">張老師鋼琴課</div></div></div></div>
        </div>
    </div>
</div>

<!-- 新增課程 Modal 彈窗 -->
<div class="modal-overlay">
    <div class="modal-card">
        <!-- 彈窗頂部標題 -->
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div style="display: flex; align-items: center; gap: 8px;">
                <div style="width: 10px; height: 10px; background: #CEAB98; border-radius: 50%;"></div>
                <div style="color: #2B3049; font-size: 18px; font-weight: 800; font-family: 'Noto Serif TC', serif;">舊生加選預約課程</div>
            </div>
            <button onclick="handleCancel()" style="width: 32px; height: 32px; background: #FAF6F0; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #2B3049;">
                ✕
            </button>
        </div>

        <!-- 已繳費剩餘時數提示卡片 -->
        <div id="remainingHoursCard" style="padding: 10px 14px; background: #FFF8E1; border: 1px solid #FFE082; border-radius: 12px; display: flex; align-items: center; justify-content: space-between;">
            <div style="display: flex; align-items: center; gap: 6px;">
                <span style="font-size: 16px;">🎟️</span>
                <span style="color: #E65100; font-size: 12px; font-weight: 700;">已繳費未排時數：</span>
            </div>
            <span id="remainingHoursDisplay" style="color: #E65100; font-size: 14px; font-weight: 800;">0 小時</span>
        </div>

        <!-- 表單欄位 -->
        <div style="display: flex; flex-direction: column; gap: 12px;">
            <div class="field-group">
                <label class="field-label">預約學員</label>
                <select id="studentSelect" class="field-select" onchange="updateStudentInfo(this.value)">
                    <!-- JS 動態填入 -->
                </select>
            </div>

            <div class="field-group">
                <label class="field-label">課程類型</label>
                <select class="field-select" id="courseTypeSelect">
                    <option value="piano" selected>個別古典鋼琴課 (2小時)</option>
                    <option value="violin">小提琴演奏精修課 (1小時)</option>
                    <option value="theory">音樂理論與聽寫視唱班 (1小時)</option>
                </select>
            </div>

            <div class="field-group">
                <label class="field-label">選擇張老師開放上課時段</label>
                <select class="field-select" id="timeSlotSelect">
                    <!-- JS 動態填入 -->
                </select>
            </div>

            <div class="field-group">
                <label class="field-label">繳費 / 折抵方式</label>
                <select class="field-select" id="paymentMethodSelect">
                    <option value="use_hours" id="optUseHours">🎟️ 使用已繳費剩餘時數折抵 (0 小時)</option>
                    <option value="postpaid" selected>💳 單堂付現 / 課後付款 (NT$ 2,000 / 堂)</option>
                    <option value="prepaid_10">📦 包堂預付 10 堂優惠 (NT$ 20,000)</option>
                </select>
            </div>
        </div>

        <!-- 按鈕區 -->
        <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 4px;">
            <button class="btn-submit-modal" onclick="handleSubmit()">
                確認送出預約
            </button>
            <button class="btn-cancel-modal" onclick="handleCancel()">
                取消返回
            </button>
        </div>
    </div>
</div>

<script>
let currentStudentId = 's0000000-0000-0000-0000-000000000005'; // Lin

function updateStudentInfo(studentId) {
    currentStudentId = studentId;
    if (!window.MusiMateDB) return;

    const students = window.MusiMateDB.getStudents();
    const current = students.find(s => s.student_id === studentId);
    if (current) {
        document.getElementById('bgStudentTag').innerText = current.name;
    }

    const hours = window.MusiMateDB.getRemainingHours(studentId);
    document.getElementById('remainingHoursDisplay').innerText = `${hours} 小時`;

    const optHours = document.getElementById('optUseHours');
    if (hours > 0) {
        optHours.innerText = `🎟️ 使用已繳費剩餘時數折抵 (剩餘 ${hours} 小時)`;
        optHours.disabled = false;
        document.getElementById('paymentMethodSelect').value = 'use_hours';
    } else {
        optHours.innerText = `🎟️ 使用已繳費剩餘時數折抵 (目前 0 小時)`;
        optHours.disabled = true;
        document.getElementById('paymentMethodSelect').value = 'postpaid';
    }
}

function handleSubmit() {
    const courseSelect = document.getElementById('courseTypeSelect');
    const courseText = courseSelect.selectedOptions[0].text;
    const courseVal = courseSelect.value;
    
    const timeSelect = document.getElementById('timeSlotSelect');
    const startTimeIso = timeSelect.value;
    const slotText = timeSelect.selectedOptions[0]?.text || '';
    
    const paymentSelect = document.getElementById('paymentMethodSelect');
    const paymentVal = paymentSelect.value;
    
    if (!startTimeIso) {
        alert('請先選擇上課時段！');
        return;
    }

    const startDate = new Date(startTimeIso);
    const lessonDurationHours = courseVal === 'piano' ? 2 : 1;
    const endDate = new Date(startDate.getTime() + lessonDurationHours * 60 * 60 * 1000);
    
    const y = startDate.getFullYear();
    const m = String(startDate.getMonth() + 1).padStart(2, '0');
    const d = String(startDate.getDate()).padStart(2, '0');
    const sh = String(startDate.getHours()).padStart(2, '0');
    const sm = String(startDate.getMinutes()).padStart(2, '0');
    const eh = String(endDate.getHours()).padStart(2, '0');
    const em = String(endDate.getMinutes()).padStart(2, '0');

    let studentName = 'Lin (林同學)';
    if (window.MusiMateDB) {
        const students = window.MusiMateDB.getStudents();
        const cur = students.find(s => s.student_id === currentStudentId);
        if (cur) studentName = cur.name;
    }

    const isPrepaidOrHours = paymentVal === 'prepaid_10' || paymentVal === 'use_hours';

    const newAppt = {
        student_id: currentStudentId,
        student_name: studentName,
        start_time: `${y}-${m}-${d}T${sh}:${sm}:00+08:00`,
        end_time: `${y}-${m}-${d}T${eh}:${em}:00+08:00`,
        status: 'confirmed',
        instrument: courseVal === 'violin' ? '小提琴 (Violin)' : (courseVal === 'theory' ? '音樂理論聽寫' : '鋼琴 (Piano)'),
        location: '音符琴房 A303',
        payment_status: isPrepaidOrHours ? 'paid' : 'pay_per_lesson',
        payment_type: paymentVal === 'use_hours' ? 'prepaid_hours' : (paymentVal === 'prepaid_10' ? 'prepaid' : 'postpaid'),
        memo_notes: paymentVal === 'use_hours' ? '使用已繳費時數折抵' : ''
    };
    
    if (window.MusiMateDB) {
        window.MusiMateDB.addAppointment(newAppt);

        if (paymentVal === 'use_hours') {
            window.MusiMateDB.deductRemainingHours(currentStudentId, lessonDurationHours);
        }
    }

    alert(`🎉 預約成功！\n\n已為 ${studentName} 成功加選：\n【${courseText}】\n時段：${slotText}\n\n已即時加入課表與資料庫！`);
    location.href = `../test_uiredesign/student_schedule.html?student_id=${currentStudentId}`;
}

function handleCancel() {
    location.href = `../test_uiredesign/student_schedule.html?student_id=${currentStudentId}`;
}

// 格式化輔助
function formatSlotOption(startIso, endIso, loc) {
    const d = new Date(startIso);
    const month = d.getMonth() + 1;
    const date = d.getDate();
    const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
    const w = weekdays[d.getDay()];
    const s = new Date(startIso).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
    const e = new Date(endIso).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
    return `${String(month).padStart(2, '0')}/${String(date).padStart(2, '0')} (${w}) ${s} - ${e} (${loc || '音符琴房 A303'})`;
}

document.addEventListener('DOMContentLoaded', () => {
    // 取得 URL query 中的 student_id
    const params = new URLSearchParams(window.location.search);
    const queryStudentId = params.get('student_id');

    if (window.MusiMateDB) {
        const students = window.MusiMateDB.getStudents();
        const studentSelect = document.getElementById('studentSelect');
        studentSelect.innerHTML = students.map(s => `
            <option value="${s.student_id}" ${s.student_id === queryStudentId || (queryStudentId === null && s.student_id === currentStudentId) ? 'selected' : ''}>
                ${s.name} (${s.default_instrument})
            </option>
        `).join('');

        if (queryStudentId) {
            currentStudentId = queryStudentId;
        }

        updateStudentInfo(currentStudentId);

        // 載入張老師開放時段
        const slots = window.MusiMateDB.getAvailableSlots();
        const timeSelect = document.getElementById('timeSlotSelect');
        if (slots.length > 0) {
            timeSelect.innerHTML = slots.map(s => `
                <option value="${s.start_time}">${formatSlotOption(s.start_time, s.end_time, s.location)}</option>
            `).join('');
        } else {
            timeSelect.innerHTML = '<option value="">目前開放時段已滿，請洽張老師</option>';
        }
    }
});
</script>

</body>
</html>
