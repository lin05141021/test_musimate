<!DOCTYPE html>
<html lang="zh-TW">
<head>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- 樣式庫 -->
    <link rel="stylesheet" href="../../UI/style_0824.css">
    <link rel="stylesheet" href="newclass_styles.css">
</head>
<body>

<div class="main-container">
    <!-- 1. 頂部導航列 (對齊 UI/component/navbar.html 標準組件) -->
    <div class="navbar-container" id="navbarWrapper">
        <div class="logo-box" onclick="location.href='newclass_homepage.html'">
            <img class="navbar-logo-img" src="../../UI/logo.png" alt="MusiMate" onerror="this.src='../logo.png'" />
        </div>
        <div class="nav-links">
            <a href="../test_uiredesign/schedule.html" class="nav-item" data-property-1="defult">我的課表</a>
            <a href="javascript:void(0)" onclick="alert('📖 智慧聯絡簿模組開發中，敬請期待！')" class="nav-item" data-property-1="defult">智慧聯絡簿</a>
            <a href="javascript:void(0)" onclick="alert('⏱️ 學生打卡簽到功能即將推出！')" class="nav-item" data-property-1="defult">學生打卡</a>
            <a href="../money/overview_checked.html" class="nav-item" data-property-1="defult">薪資看板</a>
            <a href="teacher_info.html" class="nav-item" data-property-1="defult">修改個人介紹</a>
        </div>
        <div class="nav-avatar-box" title="張芷嫣老師檔案" onclick="location.href='teacher_info.html'">
            <img src="../../UI/teacher_avatar.png" alt="張芷嫣老師" onerror="this.src='../teacher_avatar.png'" />
        </div>
    </div>

    <!-- 2. Hero 區塊 -->
    <div class="hero-section">
        <div class="badge-tag">
            <span>✦</span>
            <span>MUSIMATE 專業師資平台</span>
        </div>
        <h1 class="hero-title">陪你探索音樂天賦的好夥伴</h1>
        <p class="hero-desc">
            在悠揚的旋律中，找尋屬於你的律動。<br>
            挑選一把心儀的樂器，與專業導師一起譜寫美妙的樂章。
        </p>
    </div>

    <!-- 3. 樂器探索區塊 (由 JS 自動讀取資料庫 instruments 渲染) -->
    <div class="section-container">
        <h2 class="section-heading">熱門樂器課程</h2>
        <div id="instrumentGridContainer" class="instrument-grid">
            <!-- JS 動態渲染區塊 -->
        </div>
    </div>

    <!-- 4. 名師陣容區塊 (由 JS 自動讀取資料庫 teachers 渲染) -->
    <div class="section-container" style="background: #F8F5F0; width: 100%;">
        <h2 class="section-heading">精選名師陣容</h2>
        <div id="teacherGridContainer" class="teacher-grid" style="max-width: 1280px; width: 100%;">
            <!-- JS 動態渲染區塊 -->
        </div>
    </div>

    <!-- 5. 頁尾 (對齊 UI/component/footer.html 標準組件) -->
    <div class="footer">
        <div class="footer-left">
            <img class="footer-logo-img" src="../../UI/logo.png" alt="MusiMate" onerror="this.src='../logo.png'" />
            <div class="footer-slogan">專業音樂教育最貼心的好夥伴，陪您一起發掘音符中的無限可能。</div>
        </div>
        <div class="footer-copy">© 2026 MusiMate. All rights reserved.</div>
    </div>
</div>

<!-- ============================================================
     JavaScript 動態資料庫欄位綁定與渲染引擎
     ============================================================ -->
<script>
// 1. 資料庫資料模型
const database = {
    // 樂器科目庫 (instruments)
    instruments: [
        {
            id: 'inst-guitar',
            name: '吉他',
            en_name: 'Guitar',
            icon: '🎸',
            color_bg: 'rgba(229, 140, 77, 0.08)',
            accent_color: '#E58C4D',
            link: 'javascript:alert("🎸 吉他專屬課程即將推出，敬請期待！")'
        },
        {
            id: 'inst-sax',
            name: '薩克斯風',
            en_name: 'Saxophone',
            icon: '🎷',
            color_bg: 'rgba(77, 173, 184, 0.08)',
            accent_color: '#4DADB8',
            link: 'javascript:alert("🎷 薩克斯風專屬課程即將推出，敬請期待！")'
        },
        {
            id: 'inst-piano',
            name: '鋼琴',
            en_name: 'Piano',
            icon: '🎹',
            color_bg: 'rgba(181, 142, 190, 0.08)',
            accent_color: '#B58EBE',
            link: 'teacher_piano.html'
        },
        {
            id: 'inst-violin',
            name: '小提琴',
            en_name: 'Violin',
            icon: '🎻',
            color_bg: 'rgba(104, 197, 171, 0.08)',
            accent_color: '#68C5AB',
            link: 'teacher_violin.html'
        }
    ],
    // 專業教師資料庫 (teachers)
    teachers: [
        {
            id: 't-chang',
            name: '張芷嫣',
            title: '國立維也納音樂暨表演藝術大學碩士',
            instruments: ['鋼琴 (Piano)', '小提琴 (Violin)'],
            tags: ['伴奏鋼琴', '音樂班備考', '個別指導'],
            tag_color: '#B58EBE',
            tag_bg: 'rgba(181, 142, 190, 0.15)',
            avatar_bg: '#F3E5F5',
            avatar_icon: '👩‍🏫',
            bio: '國立維也納音樂大學碩士，主修小提琴與鋼琴。音樂教學資歷 10 年，曾指導超過 30 位學生考取國立音樂專班及國際鋼琴大賽獎項。擅長深入剖析觸鍵細節與聲部對位，引導學員感受樂音的純粹魅力。',
            detail_link: 'teacher_info.html',
            is_active: true
        },
        {
            id: 't-chen',
            name: '陳冠宇',
            title: '國立維也納音樂暨表演藝術大學鋼琴演奏碩士',
            instruments: ['鋼琴 (Piano)'],
            tags: ['古典鋼琴', '即興演奏', '音樂班考級'],
            tag_color: '#4DADB8',
            tag_bg: 'rgba(77, 173, 184, 0.15)',
            avatar_bg: '#E0F7FA',
            avatar_icon: '👨‍🏫',
            bio: '奧地利維也納國立音樂大學鋼琴演奏碩士。曾榮獲波蘭蕭邦國際青年鋼琴大賽入選獎。教學風趣嚴謹並重，特別著重學員觸鍵發力與踏板音色層次。',
            detail_link: 'javascript:handleInactiveTeacher("陳冠宇")',
            is_active: false
        },
        {
            id: 't-lin',
            name: '林雨晴',
            title: '巴黎師範音樂院小提琴最高演奏家文憑',
            instruments: ['小提琴 (Violin)'],
            tags: ['古典小提琴', '室內樂合奏', '成人興趣'],
            tag_color: '#68C5AB',
            tag_bg: 'rgba(104, 197, 171, 0.15)',
            avatar_bg: '#E8F5E9',
            avatar_icon: '🎻',
            bio: '獲巴黎師範音樂院最高演奏家文憑。曾任法國多個青年管弦樂團樂團首席，擅長以生動直觀的弓法比喻，幫助學生在放鬆自然中拉出優雅飽滿的音色。',
            detail_link: 'javascript:handleInactiveTeacher("林雨晴")',
            is_active: false
        }
    ]
};

function handleInactiveTeacher(name) {
    alert(`📌 【${name} 老師】個人介紹檔案建置中。\n目前系統僅開放【張芷嫣老師】專屬檔案與線上預約 Demo，歡迎點擊張老師檔案進行體驗！`);
}

// 2. 動態渲染樂器卡片
function renderInstruments() {
    const container = document.getElementById('instrumentGridContainer');
    container.innerHTML = database.instruments.map(inst => `
        <div class="instrument-card" onclick="location.href='${inst.link}'">
            <div class="instrument-img-box" style="background: ${inst.color_bg};">
                <span>${inst.icon}</span>
            </div>
            <div style="display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%;">
                <div class="instrument-title">${inst.name}</div>
                <div class="btn-learn" style="color: ${inst.accent_color}; border-color: ${inst.accent_color}; background: ${inst.color_bg};">
                    <span>開始學習</span>
                    <span>➔</span>
                </div>
            </div>
        </div>
    `).join('');
}

// 3. 動態渲染教師名卡
function renderTeachers() {
    const container = document.getElementById('teacherGridContainer');
    container.innerHTML = database.teachers.map(teacher => `
        <div class="teacher-card">
            <div class="teacher-avatar-box" style="background: ${teacher.avatar_bg};">
                <span>${teacher.avatar_icon}</span>
            </div>
            <div class="teacher-info-col">
                <div class="teacher-header-row">
                    <div class="teacher-name">${teacher.name}</div>
                    ${teacher.tags.map(tag => `
                        <div class="tag-pill" style="color: ${teacher.tag_color}; background: ${teacher.tag_bg}; border: 1px solid ${teacher.tag_color};">
                            ${tag}
                        </div>
                    `).join('')}
                </div>
                <p class="teacher-bio">${teacher.bio}</p>
                <div style="margin-top: auto; display: flex; gap: 12px;">
                    <button class="btn-book-course" onclick="${teacher.detail_link.startsWith('javascript:') ? teacher.detail_link : `location.href='${teacher.detail_link}'`}">
                        <span>${teacher.is_active ? '查看老師專屬介紹與預約' : '檔案建置中 (點擊查看)'}</span>
                        <span>➔</span>
                    </button>
                </div>
            </div>
        </div>
    `).join('');
}

// 頁面初始化
document.addEventListener('DOMContentLoaded', () => {
    renderInstruments();
    renderTeachers();
});
</script>

</body>
</html>
