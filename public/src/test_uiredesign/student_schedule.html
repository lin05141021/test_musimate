<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的課表 (學生端 RWD) - MusiMate</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- 統一共用樣式庫 -->
    <link rel="stylesheet" href="../../UI/style_0824.css">
    <link rel="stylesheet" href="schedule_styles.css">
    <!-- LINE LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <!-- Supabase 雲端即時資料庫 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- MusiMate 資料庫與 LIFF 身份認證核心 -->
    <script src="../data/musimate_db.js"></script>
</head>
<body class="mobile-view">

<div class="mobile-frame">
    <div>
        <!-- 頂部 iOS 狀態列 -->
        <div class="status-bar">
            <span>9:41</span>
            <span>📶 🔋</span>
        </div>

        <!-- 導航列 -->
        <div class="nav-header">
            <div class="brand-logo" onclick="location.href='../newclass/newclass_homepage.html'" style="cursor: pointer;">
                <div class="brand-icon">🎵</div>
                <span>MusiMate</span>
            </div>
            <div id="studentNamePill" style="display: flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px; background: rgba(206, 171, 152, 0.2); border: 1px solid #CEAB98; font-size: 13px; font-weight: 700; color: #4A3A31;">
                <span id="studentAvatarIcon">👤</span>
                <span id="studentDisplayName">劉心悅 (Lin)</span>
            </div>
        </div>

        <!-- 頁面主內容 -->
        <div class="main-content">
            <div class="page-header">
                <div style="display: flex; align-items: center; justify-content: space-between;">
                    <h1 class="page-title">我的課表</h1>
                    <span id="dbStatusBadge" style="font-size: 10px; padding: 2px 8px; border-radius: 12px; background: #E8F5E9; color: #2E7D32; font-weight: 700;">🟢 Supabase 連線中</span>
                </div>
                <p id="studentBannerSubtitle" class="page-subtitle">張芷嫣 老師 · 劉心悅 (Lin) 個人專屬課表</p>
                <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 6px; margin-bottom: 12px;">
                    <span id="lineIdDisplayTag" style="font-size: 11px; color: #5B524E; background: rgba(0,0,0,0.05); padding: 3px 8px; border-radius: 8px;">🆔 LINE: 載入中...</span>
                    <button onclick="promptBindMyLineId()" style="background: transparent; border: 1px dashed #CEAB98; border-radius: 8px; padding: 2px 8px; font-size: 11px; color: #8C6D58; cursor: pointer; font-weight: 700;">✏️ 綁定我的 LINE ID</button>
                </div>
            </div>

            <!-- 已繳費未排課剩餘時數提示膠囊 -->
            <div id="remainingHoursBadge" style="display: none; padding: 12px 14px; background: linear-gradient(135deg, rgba(206, 171, 152, 0.25) 0%, rgba(181, 142, 190, 0.25) 100%); border: 1.5px solid #CEAB98; border-radius: 14px; margin-bottom: 14px; align-items: center; justify-content: space-between;">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span style="font-size: 18px;">🎟️</span>
                    <div>
                        <div style="font-size: 13px; font-weight: 700; color: #2B3049;">已繳費未排時數：<span id="creditCount" style="color: #E65100; font-size: 15px;">0</span> 小時</div>
                        <div style="font-size: 11px; color: #6F6F6F;">無使用期限，可自由拆分折抵加選或調課</div>
                    </div>
                </div>
                <button onclick="goToBookNew()" style="padding: 6px 12px; background: #CEAB98; color: white; border: none; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer;">安排時數</button>
            </div>

            <!-- 動態課表卡片容器 (由 JS 自動讀取資料庫陣列渲染) -->
            <div id="appointmentListContainer" class="lesson-list"></div>

            <div class="list-end-hint">無新的預約課程了</div>
            <button class="btn-book-new" onclick="goToBookNew()">+ 預約新課程</button>
        </div>
    </div>

    <!-- 底部 Home Bar -->
    <div class="home-bar-wrapper">
        <div class="home-bar"></div>
    </div>
</div>

<!-- ============================================================
     JavaScript 動態資料庫欄位綁定與即時渲染引擎
     ============================================================ -->
<script>
// 格式化工具
function formatDate(isoStr) {
    const d = new Date(isoStr);
    const month = d.getMonth() + 1;
    const date = d.getDate();
    const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
    const w = weekdays[d.getDay()];
    return {
        monthDay: `${month}/${date}`,
        weekday: `(${w})`,
        fullStr: `${month}月${date}日 (週${w})`
    };
}

function formatTime(startIso, endIso) {
    const s = new Date(startIso).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
    const e = new Date(endIso).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
    return `${s} - ${e}`;
}

// 卡片模板生成
function createAppointmentCardHtml(appt) {
    const dateObj = formatDate(appt.start_time);
    const timeSpan = formatTime(appt.start_time, appt.end_time);
    const location = appt.location || '音符琴房 A303';
    const teacherName = appt.teacher_name || '林佩芬';
    const courseTitle = `${teacherName} 老師 · ${appt.instrument ? appt.instrument.split(' ')[0] : '鋼琴'}課`;
    const paymentLabel = appt.payment_status === 'paid' ? '✅ 已預付' : '💳 現金後付';
    const isNewTag = appt.is_new_badge ? `<span style="padding: 2px 8px; background: #E8F5E9; color: #2E7D32; font-size: 10px; font-weight: 800; border-radius: 6px; border: 1px solid #A5D6A7; margin-left: 6px;">✨ 新預約</span>` : '';
    const isLeave = appt.status === 'rescheduled';
    const isTeacherCancelled = appt.status === 'teacher_cancelled';

    let statusPill = paymentLabel;
    if (isLeave) {
        statusPill = '📌 已請假 (時數已保留)';
    } else if (isTeacherCancelled) {
        statusPill = '⚠️ 老師停課 (時數已保留)';
    }

    return `
    <div class="lesson-item" data-id="${appt.id}" style="${(isLeave || isTeacherCancelled) ? 'opacity: 0.85;' : ''}">
        <div class="date-badge" style="${(isLeave || isTeacherCancelled) ? 'background: #FFF8E1; border-color: #FFE082;' : ''}">
            <div class="day-number" style="${(isLeave || isTeacherCancelled) ? 'color: #F57F17;' : ''}">${dateObj.monthDay}</div>
            <div class="day-weekday" style="${(isLeave || isTeacherCancelled) ? 'color: #F57F17;' : ''}">${dateObj.weekday}</div>
        </div>
        <div class="lesson-card-right">
            <div class="info-card" style="${(isLeave || isTeacherCancelled) ? 'border-color: #FFE082; background: #FFFCF2;' : ''}">
                <div class="info-card-left">
                    <div class="time-text">${timeSpan} ${isNewTag}</div>
                    <div class="course-title">${courseTitle}</div>
                    <div class="location-text">
                        <span>${location}</span>
                        <span class="payment-pill" style="${(isLeave || isTeacherCancelled) ? 'background: #FFF3E0; color: #E65100;' : ''}">${statusPill}</span>
                    </div>
                </div>
                <div class="music-gradient-icon">${(isLeave || isTeacherCancelled) ? '⏳' : '🎵'}</div>
            </div>
            <button class="btn-reschedule" style="${(isLeave || isTeacherCancelled) ? 'background: #FFF3E0; color: #E65100; border-color: #FFE082;' : ''}" onclick="handleRescheduleClick('${appt.id}')">
                ${(isLeave || isTeacherCancelled) ? '重新安排補課時段' : '我要請假/調課'}
            </button>
        </div>
    </div>
    `;
}

let currentActiveStudent = null;

function populateStudentSwitcher() {
    if (!window.MusiMateDB) return;
    const students = window.MusiMateDB.getStudents();
    const sel = document.getElementById('studentSelectSwitcher');
    if (!sel || students.length === 0) return;

    const currentVal = sel.value;
    sel.innerHTML = students.map(s => `
        <option value="${s.student_id}">${s.name}</option>
    `).join('');

    if (currentVal && students.some(s => s.student_id === currentVal)) {
        sel.value = currentVal;
    } else if (currentActiveStudent) {
        sel.value = currentActiveStudent.student_id;
    }
}

function switchStudentView(studentId) {
    if (!studentId || !window.MusiMateDB) return;
    renderSchedule(studentId);
}

function updateStudentHeader(student, lineDisplayName) {
    if (!student) return;
    const avatarEl = document.getElementById('studentAvatarIcon');
    const subTitleEl = document.getElementById('studentBannerSubtitle');
    const nameEl = document.getElementById('studentDisplayName');
    const lineTag = document.getElementById('lineIdDisplayTag');

    const displayName = lineDisplayName || student.name || '劉心悅 (Lin)';
    if (nameEl) {
        nameEl.innerText = displayName;
    }
    if (avatarEl && student.avatar_url) {
        avatarEl.innerHTML = `<img src="${student.avatar_url}" style="width: 22px; height: 22px; border-radius: 50%; object-fit: cover;" alt="avatar" />`;
    }
    if (subTitleEl) {
        subTitleEl.innerText = `張芷嫣 老師 · ${displayName} 個人專屬課表`;
    }
    if (lineTag) {
        const lineId = student.line_user_id || localStorage.getItem('custom_test_line_user_id') || 'Uf2457bf35e0d6d3060b60838d9a9c91c';
        lineTag.innerText = lineId ? `🆔 LINE: ${lineId.slice(0, 10)}... (已綁定)` : '🆔 LINE: 尚未綁定';
        lineTag.style.color = lineId ? '#2E7D32' : '#8C827A';
    }
}

function promptBindMyLineId() {
    const currentId = (currentActiveStudent && currentActiveStudent.line_user_id) || localStorage.getItem('custom_test_line_user_id') || 'Uf2457bf35e0d6d3060b60838d9a9c91c';
    const newId = prompt('請輸入您的 LINE User ID（例如: U1234567890abcdef...）：', currentId);
    if (newId !== null) {
        const trimmed = newId.trim();
        if (trimmed) {
            localStorage.setItem('custom_test_line_user_id', trimmed);
            if (currentActiveStudent && window.MusiMateDB) {
                window.MusiMateDB.bindStudentLineUserId(currentActiveStudent.name, trimmed);
                window.MusiMateDB.bindStudentLineUserId(currentActiveStudent.student_id, trimmed);
            }
            alert(`✅ 已成功將您的 LINE ID:\n${trimmed}\n綁定至學員【${currentActiveStudent ? currentActiveStudent.name : '劉心悅 (Lin)'}】！`);
        } else {
            localStorage.removeItem('custom_test_line_user_id');
            alert('已清除自訂 LINE ID 設定。');
        }
        location.reload();
    }
}

function renderSchedule(studentId) {
    const container = document.getElementById('appointmentListContainer');
    if (!window.MusiMateDB) return;

    const urlParams = new URLSearchParams(window.location.search);
    const lineIdParam = urlParams.get('line_user_id') || urlParams.get('line_id');

    const students = window.MusiMateDB.getStudents();
    let targetStudent = null;

    if (studentId) {
        targetStudent = students.find(s => s.student_id === studentId || s.name === studentId || s.name.includes(studentId));
    }
    if (!targetStudent && lineIdParam) {
        targetStudent = students.find(s => s.line_user_id === lineIdParam);
        if (!targetStudent) {
            targetStudent = students.find(s => s.name.includes('劉心悅') || s.name.includes('Lin')) || students[0];
            if (targetStudent) {
                window.MusiMateDB.bindStudentLineUserId(targetStudent.name, lineIdParam);
                window.MusiMateDB.bindStudentLineUserId(targetStudent.student_id, lineIdParam);
            }
        }
    }
    if (!targetStudent) {
        // 預設以全組統一 Demo 學生劉心悅 (Lin) 呈現
        targetStudent = students.find(s => s.name.includes('劉心悅') || s.name.includes('Lin'))
            || students.find(s => s.name === '林小明')
            || students[0];
    }
    if (!targetStudent) return;

    currentActiveStudent = targetStudent;
    updateStudentHeader(targetStudent);
    const targetStudentId = targetStudent.student_id;

    // 同步查詢學生預約課表 (支援姓名與 ID 交叉檢索)
    let appts = window.MusiMateDB.getAppointmentsByStudent(targetStudent.name);
    if (appts.length === 0 && targetStudentId) {
        appts = window.MusiMateDB.getAppointmentsByStudent(targetStudentId);
    }

    // 檢查已繳費剩餘時數
    const hours = window.MusiMateDB.getRemainingHours(targetStudentId);
    const badge = document.getElementById('remainingHoursBadge');
    if (badge) {
        if (hours > 0) {
            badge.style.display = 'flex';
            document.getElementById('creditCount').innerText = hours;
        } else {
            badge.style.display = 'none';
        }
    }

    if (appts.length === 0) {
        container.innerHTML = `
            <div style="padding: 40px 20px; text-align: center; color: #8C827A; background: rgba(255,255,255,0.7); border-radius: 16px; margin: 10px 0;">
                <div style="font-size: 32px; margin-bottom: 8px;">🎼</div>
                <div style="font-weight: 700; font-size: 15px; color: #2B3049;">目前尚無已排定的個人課程</div>
                <div style="font-size: 12px; color: #7A736E; margin-top: 4px;">點擊下方「預約新課程」挑選開放時段</div>
            </div>
        `;
        return;
    }

    container.innerHTML = appts.map(appt => createAppointmentCardHtml(appt)).join('');
}

function handleRescheduleClick(appointmentId) {
    window.location.href = `student_changeclass.html?lesson_id=${appointmentId}`;
}

function goToBookNew() {
    window.location.href = `../newclass/oldstudent_newclass.html`;
}

async function initLiffAuth() {
    try {
        if (typeof liff !== 'undefined') {
            await liff.init({ liffId: '2011164851-lGsEnQWB' });
            
            // 關鍵修正：只有在手機 LINE App 內部才執行強制登入；
            // 若在一般電腦桌機瀏覽器開啟，略過 liff.login() 避免被強制跳轉至 LINE OAuth 登入頁面
            if (liff.isInClient()) {
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }
            }

            if (liff.isLoggedIn()) {
                const profile = await liff.getProfile();
                console.log('✅ LINE LIFF 學生登入成功:', profile);
                if (window.MusiMateDB && profile && profile.userId) {
                    const result = window.MusiMateDB.authLiffUser(profile);
                    if (result && result.student) {
                        currentActiveStudent = result.student;
                        updateStudentHeader(result.student, result.user ? result.user.name : profile.displayName);
                        renderSchedule(result.student.student_id || result.student.id);
                        const sub = document.getElementById('studentBannerSubtitle');
                        const sName = result.student ? result.student.name : (result.user ? result.user.name : profile.displayName);
                        if (sub) sub.innerText = `張芷嫣 老師 · ${sName} 個人課表 (🟢 LINE 帳號已連線)`;
                    }
                }
            } else {
                console.log('💻 偵測為外部電腦瀏覽器環境，略過強制跳轉，直接以 Demo 學生林小明進行預覽。');
            }
        }
    } catch (e) {
        console.warn('LIFF Auth skipped or failed:', e);
    }
}

// 監聽 Supabase 雲端即時同步
window.addEventListener('musimate_db_synced', () => {
    console.log('⚡ 學生端收到 Supabase 最新課表同步！');
    populateStudentSwitcher();
    if (currentActiveStudent) {
        renderSchedule(currentActiveStudent.student_id || currentActiveStudent.id);
    }
});

document.addEventListener('DOMContentLoaded', () => {
    populateStudentSwitcher();
    const urlParams = new URLSearchParams(window.location.search);
    const paramStudentId = urlParams.get('student_id') || urlParams.get('student');
    renderSchedule(paramStudentId);
    initLiffAuth();
});
</script>

</body>
</html>
