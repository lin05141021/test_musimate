<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鋼琴專屬名師陣容與課程 - MusiMate</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- 樣式庫 -->
    <link rel="stylesheet" href="../../UI/style_0824.css">
    <link rel="stylesheet" href="newclass_styles.css">
</head>
<body>

<div class="main-container">
    <!-- 1. 頂部導航列 (對齊 UI/component/navbar.html 標準組件) -->
    <div class="navbar-container" id="navbarWrapper">
        <div class="logo-box" onclick="location.href='newclass_homepage.html'">
            <img class="navbar-logo-img" src="../../UI/logo.png" alt="MusiMate" onerror="this.src='../logo.png'" />
        </div>
        <div class="nav-links">
            <a href="../test_uiredesign/schedule.html" class="nav-item" data-property-1="defult">我的課表</a>
            <a href="javascript:void(0)" onclick="alert('📖 智慧聯絡簿模組開發中，敬請期待！')" class="nav-item" data-property-1="defult">智慧聯絡簿</a>
            <a href="javascript:void(0)" onclick="alert('⏱️ 學生打卡簽到功能即將推出！')" class="nav-item" data-property-1="defult">學生打卡</a>
            <a href="../money/overview_checked.html" class="nav-item" data-property-1="defult">薪資看板</a>
            <a href="teacher_info.html" class="nav-item" data-property-1="defult">修改個人介紹</a>
        </div>
        <div class="nav-avatar-box" title="張芷嫣老師檔案" onclick="location.href='teacher_info.html'">
            <img src="../../UI/teacher_avatar.png" alt="張芷嫣老師" onerror="this.src='../teacher_avatar.png'" />
        </div>
    </div>

    <!-- 2. Hero 區塊 -->
    <div class="hero-section">
        <div class="badge-tag" style="color: #B58EBE; background: rgba(181, 142, 190, 0.12);">
            <span>🎹</span>
            <span>PIANO MASTER CLASS</span>
        </div>
        <h1 class="hero-title">鋼琴名師專屬課程</h1>
        <p class="hero-desc">
            黑白琴鍵間的優雅跳躍，專業指法與觸鍵詮釋。<br>
            從古典奏鳴曲到現代即興，帶您領略指尖流淌的極致美感。
        </p>
    </div>

    <!-- 3. 師資列表區塊 (由 JS 自動讀取資料庫渲染) -->
    <div class="section-container">
        <div style="width: 100%; max-width: 1280px; display: flex; justify-content: space-between; align-items: center;">
            <h2 class="section-heading" style="text-align: left;">精選鋼琴導師陣容</h2>
            <div style="font-size: 13px; font-weight: 700; color: #7A736E;">共 3 位專業駐點鋼琴師資</div>
        </div>
        <div id="pianoTeachersContainer" class="teacher-grid" style="max-width: 1280px; width: 100%;">
            <!-- JS 動態渲染區塊 -->
        </div>
    </div>

    <!-- 4. 頁尾 (對齊 UI/component/footer.html 標準組件) -->
    <div class="footer">
        <div class="footer-left">
            <img class="footer-logo-img" src="../../UI/logo.png" alt="MusiMate" onerror="this.src='../logo.png'" />
            <div class="footer-slogan">專業音樂教育最貼心的好夥伴，陪您一起發掘音符中的無限可能。</div>
        </div>
        <div class="footer-copy">© 2026 MusiMate. All rights reserved.</div>
    </div>
</div>

<!-- ============================================================
     JavaScript 動態資料庫欄位綁定與渲染引擎
     ============================================================ -->
<script>
// 1. 鋼琴教師資料庫模型
const pianoTeachers = [
    {
        id: 't-chang',
        name: '張芷嫣',
        title: '國立師大音樂碩士 · 鋼琴伴奏專長',
        tags: ['伴奏鋼琴', '音樂班備考', '個別指導'],
        tag_color: '#B58EBE',
        tag_bg: 'rgba(181, 142, 190, 0.15)',
        avatar_bg: '#F3E5F5',
        avatar_icon: '👩‍🏫',
        bio: '國立師大音樂系碩士，主修鋼琴，副修豎笛與室內樂。音樂教學資歷 10 年，曾指導超過 30 位學生考取國立音樂班與各大鋼琴比賽獎項。擅長深入剖析觸鍵細節與聲部對位，引導學員感受樂音的純粹魅力。',
        detail_link: 'teacher_info.html',
        is_active: true
    },
    {
        id: 't-chen',
        name: '陳冠宇',
        title: '奧地利維也納國立音樂大學碩士',
        tags: ['古典鋼琴', '即興演奏', '音樂班考級'],
        tag_color: '#4DADB8',
        tag_bg: 'rgba(77, 173, 184, 0.15)',
        avatar_bg: '#E0F7FA',
        avatar_icon: '👨‍🏫',
        bio: '奧地利維也納國立音樂大學鋼琴演奏碩士。曾榮獲波蘭蕭邦國際青年鋼琴大賽入選獎。教學風趣嚴謹並重，特別著重學員觸鍵發力與踏板音色層次。',
        detail_link: 'javascript:handleInactiveTeacher("陳冠宇")',
        is_active: false
    },
    {
        id: 't-lin-jr',
        name: '林佳蓉',
        title: '德國漢諾威音樂學院鋼琴演奏碩士',
        tags: ['啟蒙鋼琴', '成人鋼琴', '流行即興'],
        tag_color: '#E58C4D',
        tag_bg: 'rgba(229, 140, 77, 0.15)',
        avatar_bg: '#FFF3E0',
        avatar_icon: '👩‍🎨',
        bio: '德國漢諾威音樂學院鋼琴碩士。擅長耐心啟發式教學，讓初學者在無壓力的互動中快速掌握視譜技巧與節奏律動。',
        detail_link: 'javascript:handleInactiveTeacher("林佳蓉")',
        is_active: false
    }
];

function handleInactiveTeacher(name) {
    alert(`📌 【${name} 老師】個人檔案資料建置中。\n目前系統僅開放【張芷嫣老師】專屬頁面與線上預約，歡迎點擊張老師檔案進行體驗！`);
}

// 2. 動態渲染鋼琴教師卡片
function renderPianoTeachers() {
    const container = document.getElementById('pianoTeachersContainer');
    container.innerHTML = pianoTeachers.map(teacher => `
        <div class="teacher-card">
            <div class="teacher-avatar-box" style="background: ${teacher.avatar_bg};">
                <span>${teacher.avatar_icon}</span>
            </div>
            <div class="teacher-info-col">
                <div class="teacher-header-row">
                    <div class="teacher-name">${teacher.name}</div>
                    ${teacher.tags.map(tag => `
                        <div class="tag-pill" style="color: ${teacher.tag_color}; background: ${teacher.tag_bg}; border: 1px solid ${teacher.tag_color};">
                            ${tag}
                        </div>
                    `).join('')}
                </div>
                <div style="font-size: 13px; font-weight: 700; color: #8C827A;">${teacher.title}</div>
                <p class="teacher-bio">${teacher.bio}</p>
                <div style="margin-top: auto; display: flex; gap: 12px;">
                    <button class="btn-book-course" onclick="${teacher.detail_link.startsWith('javascript:') ? teacher.detail_link : `location.href='${teacher.detail_link}'`}">
                        <span>${teacher.is_active ? `預約 ${teacher.name} 老師鋼琴課` : '檔案建置中 (點擊查看)'}</span>
                        <span>➔</span>
                    </button>
                </div>
            </div>
        </div>
    `).join('');
}

document.addEventListener('DOMContentLoaded', () => {
    renderPianoTeachers();
});
</script>

</body>
</html>
