<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的課表 (學生端 RWD) - MusiMate</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- 統一共用樣式庫 -->
    <link rel="stylesheet" href="../../UI/style_0824.css">
    <link rel="stylesheet" href="schedule_styles.css">
    <!-- LINE LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <!-- Supabase 雲端即時資料庫 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- MusiMate 資料庫與 LIFF 身份認證核心 -->
    <script src="../data/musimate_db.js"></script>
</head>
<body class="mobile-view">

<div class="mobile-frame">
    <div>
        <!-- 頂部 iOS 狀態列 -->
        <div class="status-bar">
            <span>9:41</span>
            <span>📶 🔋</span>
        </div>

        <!-- 導航列 -->
        <div class="nav-header">
            <div class="brand-logo" onclick="location.href='../newclass/newclass_homepage.html'" style="cursor: pointer;">
                <div class="brand-icon">🎵</div>
                <span>MusiMate</span>
            </div>
            <div id="studentNamePill" onclick="openStudentSwitcherModal()" style="display: flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 20px; background: rgba(206, 171, 152, 0.25); border: 1px solid #CEAB98; font-size: 13px; font-weight: 700; color: #4A3A31; cursor: pointer; transition: all 0.2s ease;">
                <span id="studentAvatarIcon">👤</span>
                <span id="studentDisplayName">載入中...</span>
                <span style="font-size: 10px; color: #8C6D58; margin-left: 2px;">▼</span>
            </div>
        </div>

        <!-- 頁面主內容 -->
        <div class="main-content">
            <div class="page-header">
                <div style="display: flex; align-items: center; justify-content: space-between;">
                    <h1 class="page-title">我的課表</h1>
                    <span id="dbStatusBadge" style="font-size: 10px; padding: 2px 8px; border-radius: 12px; background: #E8F5E9; color: #2E7D32; font-weight: 700;">🟢 Supabase 連線中</span>
                </div>
                <p id="studentBannerSubtitle" class="page-subtitle">林佩芬 老師 · 個人專屬課表</p>
                <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 6px; margin-bottom: 12px;">
                    <span id="lineIdDisplayTag" style="font-size: 11px; color: #5B524E; background: rgba(0,0,0,0.05); padding: 3px 8px; border-radius: 8px;">🆔 LINE: 載入中...</span>
                    <button onclick="promptBindMyLineId()" style="background: transparent; border: 1px dashed #CEAB98; border-radius: 8px; padding: 2px 8px; font-size: 11px; color: #8C6D58; cursor: pointer; font-weight: 700;">✏️ 綁定/切換學員</button>
                </div>
            </div>

            <!-- 已繳費未排課剩餘時數提示膠囊 -->
            <div id="remainingHoursBadge" style="display: none; padding: 12px 14px; background: linear-gradient(135deg, rgba(206, 171, 152, 0.25) 0%, rgba(181, 142, 190, 0.25) 100%); border: 1.5px solid #CEAB98; border-radius: 14px; margin-bottom: 14px; align-items: center; justify-content: space-between;">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span style="font-size: 18px;">🎟️</span>
                    <div>
                        <div style="font-size: 13px; font-weight: 700; color: #2B3049;">已繳費未排時數：<span id="creditCount" style="color: #E65100; font-size: 15px;">0</span> 小時</div>
                        <div style="font-size: 11px; color: #6F6F6F;">無使用期限，可自由拆分折抵加選或調課</div>
                    </div>
                </div>
                <button onclick="goToBookNew()" style="padding: 6px 12px; background: #CEAB98; color: white; border: none; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer;">安排時數</button>
            </div>

            <!-- 動態課表卡片容器 (由 JS 自動讀取資料庫陣列渲染) -->
            <div id="appointmentListContainer" class="lesson-list"></div>

            <div class="list-end-hint">無新的預約課程了</div>
            <button class="btn-book-new" onclick="goToBookNew()">+ 預約新課程</button>
        </div>
    </div>

    <!-- 底部 Home Bar -->
    <div class="home-bar-wrapper">
        <div class="home-bar"></div>
    </div>
</div>

<!-- ============================================================
     學員切換 Modal (方便教師與多學員測試)
     ============================================================ -->
<div id="studentSwitcherModal" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 16px;">
    <div style="width: 100%; max-width: 360px; background: white; border-radius: 24px; padding: 24px; box-shadow: 0 16px 40px rgba(0,0,0,0.25); display: flex; flex-direction: column; gap: 16px;">
        <div style="display: flex; align-items: center; justify-content: space-between;">
            <div style="font-size: 16px; font-weight: 700; color: #2B3049;">👥 切換學員課表</div>
            <button onclick="closeStudentSwitcherModal()" style="background: none; border: none; font-size: 18px; cursor: pointer; color: #8C827A;">✖</button>
        </div>
        <p style="font-size: 12px; color: #7A736E; margin: 0;">點選欲切換檢視的學員，或輸入新學員姓名：</p>
        
        <div id="switcherStudentList" style="max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px;">
            <!-- 由 JS 動態產生 -->
        </div>

        <div style="border-top: 1px dashed #E0D9D0; padding-top: 12px; display: flex; gap: 8px;">
            <input id="newStudentNameInput" type="text" placeholder="輸入新學員姓名 (如: 久美)" style="flex: 1; padding: 8px 12px; border: 1px solid #CEAB98; border-radius: 10px; font-size: 13px;" />
            <button onclick="addNewCustomStudent()" style="padding: 8px 14px; background: #CEAB98; color: white; border: none; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer;">新增</button>
        </div>
    </div>
</div>

<!-- ============================================================
     JavaScript 動態資料庫欄位綁定與即時渲染引擎
     ============================================================ -->
<script>
// 格式化工具
function formatDate(isoStr) {
    const d = new Date(isoStr);
    const month = d.getMonth() + 1;
    const date = d.getDate();
    const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
    const w = weekdays[d.getDay()];
    return {
        monthDay: `${month}/${date}`,
        weekday: `(${w})`,
        fullStr: `${month}月${date}日 (週${w})`
    };
}

function formatTime(startIso, endIso) {
    const s = new Date(startIso).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
    const e = new Date(endIso).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
    return `${s} - ${e}`;
}

// 卡片模板生成
function createAppointmentCardHtml(appt) {
    const dateObj = formatDate(appt.start_time);
    const timeSpan = formatTime(appt.start_time, appt.end_time);
    const location = appt.location || '音符琴房 A303';
    const teacherName = appt.teacher_name || '林佩芬';
    const courseTitle = `${teacherName} 老師 · ${appt.instrument ? appt.instrument.split(' ')[0] : '鋼琴'}課`;
    const paymentLabel = appt.payment_status === 'paid' ? '✅ 已預付' : '💳 現金後付';
    const isNewTag = appt.is_new_badge ? `<span style="padding: 2px 8px; background: #E8F5E9; color: #2E7D32; font-size: 10px; font-weight: 800; border-radius: 6px; border: 1px solid #A5D6A7; margin-left: 6px;">✨ 新預約</span>` : '';
    const isLeave = appt.status === 'rescheduled';
    const isTeacherCancelled = appt.status === 'teacher_cancelled';

    let statusPill = paymentLabel;
    if (isLeave) {
        statusPill = '📌 已請假 (時數已保留)';
    } else if (isTeacherCancelled) {
        statusPill = '⚠️ 老師停課 (時數已保留)';
    }

    return `
    <div class="lesson-item" data-id="${appt.id}" style="${(isLeave || isTeacherCancelled) ? 'opacity: 0.85;' : ''}">
        <div class="date-badge" style="${(isLeave || isTeacherCancelled) ? 'background: #FFF8E1; border-color: #FFE082;' : ''}">
            <div class="day-number" style="${(isLeave || isTeacherCancelled) ? 'color: #F57F17;' : ''}">${dateObj.monthDay}</div>
            <div class="day-weekday" style="${(isLeave || isTeacherCancelled) ? 'color: #F57F17;' : ''}">${dateObj.weekday}</div>
        </div>
        <div class="lesson-card-right">
            <div class="info-card" style="${(isLeave || isTeacherCancelled) ? 'border-color: #FFE082; background: #FFFCF2;' : ''}">
                <div class="info-card-left">
                    <div class="time-text">${timeSpan} ${isNewTag}</div>
                    <div class="course-title">${courseTitle}</div>
                    <div class="location-text">
                        <span>${location}</span>
                        <span class="payment-pill" style="${(isLeave || isTeacherCancelled) ? 'background: #FFF3E0; color: #E65100;' : ''}">${statusPill}</span>
                    </div>
                </div>
                <div class="music-gradient-icon">${(isLeave || isTeacherCancelled) ? '⏳' : '🎵'}</div>
            </div>
            <button class="btn-reschedule" style="${(isLeave || isTeacherCancelled) ? 'background: #FFF3E0; color: #E65100; border-color: #FFE082;' : ''}" onclick="handleRescheduleClick('${appt.id}')">
                ${(isLeave || isTeacherCancelled) ? '重新安排補課時段' : '我要請假/調課'}
            </button>
        </div>
    </div>
    `;
}

let currentActiveStudent = null;

// 學員切換 Modal 控制
function openStudentSwitcherModal() {
    if (!window.MusiMateDB) return;
    const students = window.MusiMateDB.getStudents();
    const container = document.getElementById('switcherStudentList');
    if (!container) return;

    container.innerHTML = students.map(s => {
        const isCurrent = currentActiveStudent && (currentActiveStudent.student_id === s.student_id || currentActiveStudent.name === s.name);
        return `
            <div onclick="selectStudentFromModal('${s.student_id}')" style="display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-radius: 12px; background: ${isCurrent ? 'rgba(206, 171, 152, 0.2)' : '#F9F7F5'}; border: 1px solid ${isCurrent ? '#CEAB98' : '#ECE8E3'}; cursor: pointer;">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <img src="${s.avatar_url || 'https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=150'}" style="width: 26px; height: 26px; border-radius: 50%; object-fit: cover;" />
                    <span style="font-size: 14px; font-weight: ${isCurrent ? '700' : '500'}; color: #2B3049;">${s.name}</span>
                </div>
                ${isCurrent ? '<span style="color: #CEAB98; font-weight: 700; font-size: 13px;">✓ 目前</span>' : ''}
            </div>
        `;
    }).join('');

    document.getElementById('studentSwitcherModal').style.display = 'flex';
}

function closeStudentSwitcherModal() {
    document.getElementById('studentSwitcherModal').style.display = 'none';
}

function selectStudentFromModal(studentId) {
    if (!studentId || !window.MusiMateDB) return;
    const students = window.MusiMateDB.getStudents();
    const target = students.find(s => s.student_id === studentId || s.id === studentId);
    if (target) {
        window.MusiMateDB.setActiveStudent(target.student_id);
        currentActiveStudent = target;
        updateStudentHeader(target);
        renderSchedule(target.student_id);
    }
    closeStudentSwitcherModal();
}

function addNewCustomStudent() {
    const input = document.getElementById('newStudentNameInput');
    if (!input) return;
    const name = input.value.trim();
    if (!name) {
        alert('請輸入學員姓名！');
        return;
    }
    if (!window.MusiMateDB) return;
    
    const newStudent = {
        student_id: `custom-stu-${Date.now()}`,
        id: `custom-stu-${Date.now()}`,
        name: name,
        avatar_url: `https://api.dicebear.com/7.x/notionists/svg?seed=${encodeURIComponent(name)}`,
        line_user_id: null,
        default_instrument: '古典鋼琴 (Piano)',
        default_location: '音符琴房 A303',
        rate_per_lesson: 1600
    };
    window.MusiMateDB.registerCustomStudent(newStudent);
    window.MusiMateDB.setActiveStudent(newStudent.student_id);
    currentActiveStudent = newStudent;
    updateStudentHeader(newStudent);
    renderSchedule(newStudent.student_id);
    input.value = '';
    closeStudentSwitcherModal();
    alert(`✅ 已成功切換至學員【${name}】專屬課表！`);
}

function updateStudentHeader(student, lineDisplayName) {
    if (!student) return;
    const avatarEl = document.getElementById('studentAvatarIcon');
    const subTitleEl = document.getElementById('studentBannerSubtitle');
    const nameEl = document.getElementById('studentDisplayName');
    const lineTag = document.getElementById('lineIdDisplayTag');

    const displayName = lineDisplayName || student.name || '學員';
    if (nameEl) {
        nameEl.innerText = displayName;
    }
    if (avatarEl && student.avatar_url) {
        avatarEl.innerHTML = `<img src="${student.avatar_url}" style="width: 22px; height: 22px; border-radius: 50%; object-fit: cover;" alt="avatar" />`;
    }
    if (subTitleEl) {
        subTitleEl.innerText = `林佩芬 老師 · ${displayName} 個人專屬課表`;
    }
    if (lineTag) {
        const lineId = student.line_user_id || localStorage.getItem(`line_user_id_${student.name}`) || localStorage.getItem(`line_user_id_${student.student_id}`);
        lineTag.innerText = lineId ? `🆔 LINE: ${lineId.slice(0, 8)}... (已綁定)` : '🆔 LINE: 尚未綁定';
        lineTag.style.color = lineId ? '#2E7D32' : '#8C827A';
    }
}

function promptBindMyLineId() {
    openStudentSwitcherModal();
}

function renderSchedule(studentId) {
    const container = document.getElementById('appointmentListContainer');
    if (!window.MusiMateDB) return;

    const urlParams = new URLSearchParams(window.location.search);
    const lineIdParam = urlParams.get('line_user_id') || urlParams.get('line_id');
    const queryStudentParam = urlParams.get('student_id') || urlParams.get('student') || urlParams.get('name') || urlParams.get('student_name');

    const students = window.MusiMateDB.getStudents();
    let targetStudent = null;

    // 1. 優先由傳入的 studentId 或 URL query 尋找
    const targetKey = studentId || queryStudentParam;
    if (targetKey) {
        targetStudent = students.find(s => 
            s.student_id === targetKey || 
            s.id === targetKey || 
            s.name === targetKey || 
            s.name.includes(targetKey) ||
            targetKey.includes(s.name)
        );
    }

    // 2. 其次由 LINE user ID 比對
    if (!targetStudent && lineIdParam) {
        targetStudent = students.find(s => s.line_user_id === lineIdParam);
    }

    // 3. 再次由上次作用中學員取得
    if (!targetStudent) {
        targetStudent = window.MusiMateDB.getActiveStudent();
    }

    // 4. 若無，依序以「久美」、「劉心悅」或首位學員呈現
    if (!targetStudent) {
        targetStudent = students.find(s => s.name && s.name.includes('久美'))
            || students.find(s => s.name && (s.name.includes('劉心悅') || s.name.includes('Lin')))
            || students[0];
    }
    if (!targetStudent) return;

    currentActiveStudent = targetStudent;
    updateStudentHeader(targetStudent);
    const targetStudentId = targetStudent.student_id || targetStudent.id;

    // 同步查詢學生預約課表 (支援姓名與 ID 交叉檢索)
    let appts = window.MusiMateDB.getAppointmentsByStudent(targetStudent.name);
    if (appts.length === 0 && targetStudentId) {
        appts = window.MusiMateDB.getAppointmentsByStudent(targetStudentId);
    }

    // 檢查已繳費剩餘時數
    const hours = window.MusiMateDB.getRemainingHours(targetStudentId);
    const badge = document.getElementById('remainingHoursBadge');
    if (badge) {
        if (hours > 0) {
            badge.style.display = 'flex';
            document.getElementById('creditCount').innerText = hours;
        } else {
            badge.style.display = 'none';
        }
    }

    if (appts.length === 0) {
        container.innerHTML = `
            <div style="padding: 40px 20px; text-align: center; color: #8C827A; background: rgba(255,255,255,0.7); border-radius: 16px; margin: 10px 0;">
                <div style="font-size: 32px; margin-bottom: 8px;">🎼</div>
                <div style="font-weight: 700; font-size: 15px; color: #2B3049;">目前尚無已排定的個人課程</div>
                <div style="font-size: 12px; color: #7A736E; margin-top: 4px;">點擊下方「預約新課程」挑選開放時段</div>
            </div>
        `;
        return;
    }

    container.innerHTML = appts.map(appt => createAppointmentCardHtml(appt)).join('');
}

function handleRescheduleClick(appointmentId) {
    window.location.href = `student_changeclass.html?lesson_id=${appointmentId}`;
}

function goToBookNew() {
    const sId = currentActiveStudent ? (currentActiveStudent.student_id || currentActiveStudent.id) : '';
    window.location.href = `../newclass/oldstudent_newclass.html${sId ? '?student_id=' + sId : ''}`;
}

async function initLiffAuth() {
    try {
        if (typeof liff !== 'undefined') {
            await liff.init({ liffId: '2011164851-lGsEnQWB' });
            
            // 只有在手機 LINE App 內部才執行強制登入
            if (liff.isInClient()) {
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }
            }

            if (liff.isLoggedIn()) {
                const profile = await liff.getProfile();
                console.log('✅ LINE LIFF 學生登入成功:', profile);
                if (window.MusiMateDB && profile && profile.userId) {
                    const result = window.MusiMateDB.authLiffUser(profile);
                    if (result && result.student) {
                        currentActiveStudent = result.student;
                        const sName = result.student.name || profile.displayName || '學員';
                        updateStudentHeader(result.student, sName);
                        renderSchedule(result.student.student_id || result.student.id);
                        const sub = document.getElementById('studentBannerSubtitle');
                        if (sub) sub.innerText = `林佩芬 老師 · ${sName} 個人課表 (🟢 LINE 帳號已連線)`;
                    }
                }
            } else {
                console.log('💻 外部瀏覽器預覽模式');
            }
        }
    } catch (e) {
        console.warn('LIFF Auth skipped or failed:', e);
    }
}

// 監聽 Supabase 雲端即時同步
window.addEventListener('musimate_db_synced', () => {
    console.log('⚡ 學生端收到 Supabase 最新課表同步！');
    if (currentActiveStudent) {
        renderSchedule(currentActiveStudent.student_id || currentActiveStudent.id);
    }
});

document.addEventListener('DOMContentLoaded', () => {
    // 檢查是否有 redirect 或 action 參數 (支援 LINE LIFF 跳轉分發)
    const urlParams = new URLSearchParams(window.location.search);
    let redirect = urlParams.get('redirect') || urlParams.get('page');
    let action = urlParams.get('action');

    if (urlParams.get('liff.state')) {
        try {
            const state = decodeURIComponent(urlParams.get('liff.state'));
            const matchRedirect = state.match(/redirect=([^&]+)/);
            if (matchRedirect) redirect = matchRedirect[1];
            const matchPage = state.match(/page=([^&]+)/);
            if (matchPage) redirect = matchPage[1];
            const matchAction = state.match(/action=([^&]+)/);
            if (matchAction) action = matchAction[1];
            if (!action && (state.includes('reschedule') || state.includes('leave'))) {
                action = 'reschedule';
            }
        } catch (e) {}
    }

    if (redirect) {
        if (redirect.startsWith('/student/') || redirect.startsWith('/admin/')) {
            window.location.replace(redirect);
            return;
        }
        if (redirect.includes('billing')) {
            window.location.replace('/student/billing');
            return;
        } else if (redirect.includes('practice')) {
            window.location.replace('/student/practice');
            return;
        } else if (redirect.includes('summary')) {
            window.location.replace('/student/summary/lesson-1');
            return;
        } else if (redirect.includes('stamps')) {
            window.location.replace('/student/stamps');
            return;
        } else if (redirect.includes('history')) {
            window.location.replace('/student/history');
            return;
        } else if (redirect.includes('courses') || redirect.includes('newclass')) {
            window.location.replace('/student/courses');
            return;
        } else if (redirect.includes('faq')) {
            window.location.replace('/student/faq');
            return;
        } else if (redirect.includes('leave') || redirect.includes('reschedule')) {
            window.location.replace('/student/schedule?action=reschedule');
            return;
        }
    }
    if (action === 'reschedule' || action === 'leave') {
        window.location.replace('student_changeclass.html');
        return;
    }

    const paramStudentId = urlParams.get('student_id') || urlParams.get('student') || urlParams.get('name');
    renderSchedule(paramStudentId);
    initLiffAuth();
});
</script>

</body>
</html>
