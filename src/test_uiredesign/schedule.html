<script>
let currentWeekOffset = 0; // 0: 2026-08-24 週
const BASE_MONDAY = new Date('2026-08-24T00:00:00+08:00');
let activeDrawerAppt = null;
let currentAddModalTab = 'appointment'; // 'appointment' or 'openslot'

function getMondayOfOffset(offsetWeeks) {
    return new Date(BASE_MONDAY.getTime() + offsetWeeks * 7 * 24 * 60 * 60 * 1000);
}

function formatDateISO(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
}

function getTimeBlockKey(isoStr) {
    const hour = new Date(isoStr).getHours();
    if (hour >= 8 && hour < 12) return 'morning';
    if (hour >= 12 && hour < 18) return 'afternoon';
    return 'evening';
}

function formatTime(startIso, endIso) {
    const s = new Date(startIso).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
    const e = new Date(endIso).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
    return `${s} - ${e}`;
}

function getStudentCardClass(studentName) {
    if (studentName.includes('Lin') || studentName.includes('林')) return 'card-lin';
    if (studentName.includes('Charles') || studentName.includes('查爾斯')) return 'card-charles';
    if (studentName.includes('Johnny') || studentName.includes('強尼')) return 'card-johnny';
    if (studentName.includes('小明') || studentName.includes('Ming')) return 'card-ming';
    if (studentName.includes('小華') || studentName.includes('Hua')) return 'card-hua';
    return 'card-lin';
}

// 渲染當前週次之 7 天
function renderTimetable() {
    const monday = getMondayOfOffset(currentWeekOffset);
    const sunday = new Date(monday.getTime() + 6 * 24 * 60 * 60 * 1000);
    
    // 更新週次標籤
    const m1 = monday.getMonth() + 1;
    const d1 = monday.getDate();
    const m2 = sunday.getMonth() + 1;
    const d2 = sunday.getDate();
    document.getElementById('weekLabelBadge').innerHTML = `${monday.getFullYear()} 年<br>${String(m1).padStart(2, '0')}月${String(d1).padStart(2, '0')}日 至 ${String(m2).padStart(2, '0')}月${String(d2).padStart(2, '0')}日`;

    const todayStr = formatDateISO(new Date());
    const weekdays = ['週一 (Mon)', '週二 (Tue)', '週三 (Wed)', '週四 (Thu)', '週五 (Fri)', '週六 (Sat)', '週日 (Sun)'];
    const days = [];
    for (let i = 0; i < 7; i++) {
        const d = new Date(monday.getTime() + i * 24 * 60 * 60 * 1000);
        const dateStr = formatDateISO(d);
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const dayNum = String(d.getDate()).padStart(2, '0');
        const isToday = (dateStr === todayStr);
        days.push({
            dateStr,
            dateLabel: `${m}/${dayNum}`,
            weekdayLabel: isToday ? `${weekdays[i]} 📍今天` : weekdays[i],
            isActive: isToday
        });
    }

    // 渲染星期 Header
    const headerRow = document.getElementById('dayHeaderRow');
    headerRow.innerHTML = `
        <div class="time-block-label-col"></div>
        ${days.map(d => `
            <div class="day-header-cell ${d.isActive ? 'active-day' : ''}">
                <div class="day-date">${d.dateLabel}</div>
                <div class="day-name">${d.weekdayLabel}</div>
            </div>
        `).join('')}
    `;

    // 取得資料庫資料
    if (!window.MusiMateDB) return;
    const { appointments, schedule_slots } = window.MusiMateDB.getTeacherSchedule();

    const blocks = ['morning', 'afternoon', 'evening'];
    const container = document.getElementById('timetableGridBody');

    container.innerHTML = days.map(day => {
        const colActiveStyle = day.isActive ? 'active-col' : '';

        const blockCellsHtml = blocks.map(blockKey => {
            const dayApps = appointments.filter(a => {
                return a.start_time.startsWith(day.dateStr) && getTimeBlockKey(a.start_time) === blockKey;
            });

            const daySlots = schedule_slots.filter(s => {
                return s.is_available && s.start_time.startsWith(day.dateStr) && getTimeBlockKey(s.start_time) === blockKey;
            });

            let itemsHtml = '';

            // 渲染預約課程
            dayApps.forEach(app => {
                const cardClass = getStudentCardClass(app.student_name);
                const timeSpan = formatTime(app.start_time, app.end_time);
                const payLabel = app.payment_status === 'paid' ? '已預付' : '現金後付';
                const isLeave = app.status === 'rescheduled';
                const isCancelled = app.status === 'teacher_cancelled';

                let cardStyleClass = cardClass;
                let statusBadge = `💳 ${payLabel}`;
                if (isLeave) {
                    cardStyleClass = 'card-leave';
                    statusBadge = '📌 已請假 (時數已保留)';
                } else if (isCancelled) {
                    cardStyleClass = 'card-teacher-cancelled';
                    statusBadge = '⚠️ 老師停課 (已退回時數)';
                }

                itemsHtml += `
                <div class="lesson-card ${cardStyleClass}" onclick="openLessonDrawer('${app.id}')">
                    <div class="card-title">${app.student_name} ${isLeave ? '<span style="font-size: 11px; color: #E65100;">(請假)</span>' : ''}</div>
                    <div class="card-subtitle">${timeSpan} · ${app.instrument ? app.instrument.split(' ')[0] : '個別課'}</div>
                    <div class="card-meta">📍 ${app.location || '音符琴房 A303'} · ${statusBadge}</div>
                </div>
                `;
            });

            // 渲染開放時段 (包含因請假自動釋放的時段)
            daySlots.forEach(slot => {
                const timeSpan = formatTime(slot.start_time, slot.end_time);
                itemsHtml += `
                <div class="slot-card slot-card-released" onclick="quickBookForOpenSlot('${slot.start_time}', '${slot.end_time}', '${slot.location}')" title="點擊快速安排學生">
                    <div class="slot-title" style="color: #2E7D32;">✨ 開放預約時段</div>
                    <div class="slot-time">${timeSpan}</div>
                    <div class="slot-location">📍 ${slot.location || '音符琴房 A303'}</div>
                </div>
                `;
            });

            return `
            <div class="cell-block">
                <div class="cell-items-wrapper">${itemsHtml}</div>
                <button class="btn-plus-slot" onclick="quickAddSlotForDay('${day.dateStr}', '${blockKey}')" title="快速新增此時段">+</button>
            </div>
            `;
        }).join('');

        return `
        <div class="day-column ${colActiveStyle}">
            ${blockCellsHtml}
        </div>
        `;
    }).join('');
}

function changeWeek(diff) {
    currentWeekOffset += diff;
    renderTimetable();
}

function resetToCurrentWeek() {
    currentWeekOffset = 0;
    renderTimetable();
}

function populateStudentDropdown() {
    const studentSelect = document.getElementById('quickStudent');
    if (!studentSelect || !window.MusiMateDB) return;

    const students = window.MusiMateDB.getStudents();
    studentSelect.innerHTML = students.map(s => `
        <option value="${s.student_id}|${s.name}|${s.default_instrument}|${s.default_location}|pay_per_lesson">
            ${s.name} (${s.default_instrument.split(' ')[0]})
        </option>
    `).join('');
}

function handleAddAppointment() {
    const studentInfo = document.getElementById('quickStudent').value.split('|');
    const studentId = studentInfo[0];
    const studentName = studentInfo[1];
    const instrument = studentInfo[2];
    const defaultLocation = studentInfo[3];
    const paymentStatus = studentInfo[4] || 'pay_per_lesson';

    const dateStr = document.getElementById('quickDate').value;
    const startTime = document.getElementById('quickStartTime').value;
    const endTime = document.getElementById('quickEndTime').value;
    const repeatCount = Number(document.getElementById('quickRepeatCount').value || 1);
    const location = document.getElementById('quickLocation').value || defaultLocation;

    const startIso = `${dateStr}T${startTime}:00+08:00`;
    const endIso = `${dateStr}T${endTime}:00+08:00`;

    const baseAppt = {
        student_id: studentId,
        student_name: studentName,
        instrument: instrument,
        start_time: startIso,
        end_time: endIso,
        location: location,
        payment_status: paymentStatus
    };

    if (window.MusiMateDB) {
        if (repeatCount > 1) {
            window.MusiMateDB.addRecurringAppointments(baseAppt, repeatCount);
            alert(`🎉 已成功連排 ${repeatCount} 堂常態課表！\n學生：${studentName}\n首堂：${dateStr} ${startTime}-${endTime}\n地點：${location}`);
        } else {
            window.MusiMateDB.addAppointment(baseAppt);
            alert(`🎉 已成功排定課表！\n學生：${studentName}\n時間：${dateStr} ${startTime}-${endTime}\n地點：${location}`);
        }
        renderTimetable();
    }
}

function handleAddOpenSlot() {
    const dateStr = document.getElementById('quickDate').value;
    const startTime = document.getElementById('quickStartTime').value;
    const endTime = document.getElementById('quickEndTime').value;
    const location = document.getElementById('quickLocation').value || '音符琴房 A303';

    const startIso = `${dateStr}T${startTime}:00+08:00`;
    const endIso = `${dateStr}T${endTime}:00+08:00`;

    if (window.MusiMateDB) {
        window.MusiMateDB.addOpenSlot({
            start_time: startIso,
            end_time: endIso,
            location: location
        });
        alert(`✨ 已成功開放自選時段！\n時間：${dateStr} ${startTime}-${endTime}\n地點：${location}\n\n學生端（加選、調課、新生試上）下拉選單現已即時同步此時段！`);
        renderTimetable();
    }
}

// 課堂抽屜操作
function openLessonDrawer(appointmentId) {
    if (!window.MusiMateDB) return;
    const { appointments } = window.MusiMateDB.getTeacherSchedule();
    const appt = appointments.find(a => a.id === appointmentId);
    if (!appt) return;

    activeDrawerAppt = appt;

    const timeSpan = formatTime(appt.start_time, appt.end_time);
    const d = new Date(appt.start_time);
    const dateStr = `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;

    document.getElementById('drawerCourseTitle').innerText = `${appt.student_name} · ${appt.instrument || '鋼琴課'}`;
    document.getElementById('drawerTimeAndPlace').innerText = `${dateStr} ${timeSpan} · ${appt.location || '音符琴房 A303'}`;
    document.getElementById('drawerPaymentStatus').innerText = appt.payment_status === 'paid' ? '✅ 已預付 / 包堂扣抵' : '💳 單堂後付 (NT$ 2,000)';
    document.getElementById('drawerMemoText').value = appt.memo_notes || '';

    // 出席打卡按鈕
    const isAttended = appt.attendance === 'attended';
    document.getElementById('attendanceToggleBtnWrap').innerHTML = `
        <button onclick="toggleAttendance('${appt.id}', '${isAttended ? 'pending' : 'attended'}')" style="padding: 6px 12px; border-radius: 10px; font-size: 12px; font-weight: 700; border: none; cursor: pointer; background: ${isAttended ? '#E8F5E9' : '#EDE7F6'}; color: ${isAttended ? '#2E7D32' : '#512DA8'};">
            ${isAttended ? '✅ 已簽到出席' : '⏱️ 標記簽到出席'}
        </button>
    `;

    document.getElementById('lessonDrawer').style.display = 'flex';
}

function closeLessonDrawer() {
    document.getElementById('lessonDrawer').style.display = 'none';
    activeDrawerAppt = null;
}

function handleOverlayClick(e) {
    if (e.target.id === 'lessonDrawer') {
        closeLessonDrawer();
    }
}

function saveLessonMemo() {
    if (!activeDrawerAppt || !window.MusiMateDB) return;
    const text = document.getElementById('drawerMemoText').value.trim();
    window.MusiMateDB.updateLessonMemo(activeDrawerAppt.id, text);
    alert('💾 課堂備忘已成功儲存並同步至智慧聯絡簿！');
}

function toggleAttendance(appointmentId, newStatus) {
    if (window.MusiMateDB) {
        window.MusiMateDB.markAttendance(appointmentId, newStatus);
        alert(newStatus === 'attended' ? '✅ 已成功完成課堂簽到！' : '已取消簽到狀態。');
        openLessonDrawer(appointmentId);
        renderTimetable();
    }
}

function handleTeacherCancelLesson() {
    if (!activeDrawerAppt || !window.MusiMateDB) return;
    const reason = prompt('請輸入老師停課原因（將自動發送 LINE 通知提醒學生）：', '老師臨時受邀出國演出，暫停乙次');
    if (!reason) return;

    window.MusiMateDB.cancelByTeacher(activeDrawerAppt.id, reason);
    alert(`🛑 已完成停課處理！\n\n1. 該堂課時數已完整退回至 ${activeDrawerAppt.student_name} 的帳戶中\n2. 系統已模擬透過 LINE LIFF 推播停課與重新預約補課通知！`);
    closeLessonDrawer();
    renderTimetable();
}

function handleTeacherHelpReschedule() {
    if (!activeDrawerAppt) return;
    location.href = `student_changeclass.html?lesson_id=${activeDrawerAppt.id}`;
}

function openContactBookModal() {
    if (!activeDrawerAppt) return;
    alert(`📖 【${activeDrawerAppt.student_name} · 智慧聯絡簿】\n\n【上課時間】${formatTime(activeDrawerAppt.start_time, activeDrawerAppt.end_time)}\n【授課樂器】${activeDrawerAppt.instrument || '鋼琴'}\n【課堂重點】${activeDrawerAppt.memo_notes || '請加強右手斷音彈奏與踏板輕踩控制'}\n【作業指派】巴哈創意曲 No.8 慢速對拍 5 遍\n\n（可至聯絡簿模組進行音檔語音錄製與 AI 重點自動摘要）`);
}

function openPracticeCheckModal() {
    if (!activeDrawerAppt) return;
    alert(`🎯 【${activeDrawerAppt.student_name} · 學生打卡練習成果】\n\n【本週累計自主練習】180 分鐘 (達標 120%)\n【最新打卡錄音】2026/08/25 20:30 上傳\n【AI 音準與節奏分析評分】94 分 🌟\n【AI 評語】右手第 16 小節十六分音符節奏穩定，音色明亮！`);
}

function openAddSlotModal(dateStr, blockKey) {
    const modal = document.getElementById('addSlotModal');
    if (!modal) return;
    
    // 預設日期
    document.getElementById('modalDate').value = dateStr || formatDateISO(new Date());
    
    // 預設時段
    if (blockKey === 'morning') {
        document.getElementById('modalStartTime').value = '10:00';
        document.getElementById('modalEndTime').value = '11:00';
    } else if (blockKey === 'afternoon') {
        document.getElementById('modalStartTime').value = '14:00';
        document.getElementById('modalEndTime').value = '15:00';
    } else if (blockKey === 'evening') {
        document.getElementById('modalStartTime').value = '19:00';
        document.getElementById('modalEndTime').value = '20:00';
    } else {
        document.getElementById('modalStartTime').value = '10:00';
        document.getElementById('modalEndTime').value = '11:00';
    }

    // 填入學生選單
    if (window.MusiMateDB) {
        const students = window.MusiMateDB.getStudents();
        const sel = document.getElementById('modalStudent');
        if (sel) {
            sel.innerHTML = students.map(s => `
                <option value="${s.student_id}">${s.name} (${s.default_instrument.split(' ')[0]}) - NT$${s.rate_per_lesson}/堂</option>
            `).join('');
        }
    }
    
    switchAddModalTab('appointment');
    modal.classList.add('active');
}

function closeAddSlotModal() {
    const modal = document.getElementById('addSlotModal');
    if (modal) modal.classList.remove('active');
}

function handleAddModalOverlayClick(e) {
    if (e.target.id === 'addSlotModal') {
        closeAddSlotModal();
    }
}

function switchAddModalTab(tab) {
    currentAddModalTab = tab;
    const btnAppt = document.getElementById('tabBtnAppointment');
    const btnSlot = document.getElementById('tabBtnOpenSlot');
    const grpStudent = document.getElementById('modalStudentGroup');
    const grpRepeat = document.getElementById('modalRepeatGroup');
    const submitBtn = document.getElementById('modalSubmitBtn');

    if (tab === 'appointment') {
        btnAppt.style.background = '#2B3049';
        btnAppt.style.color = 'white';
        btnSlot.style.background = '#FAF6F0';
        btnSlot.style.color = '#7A736E';
        grpStudent.style.display = 'flex';
        grpRepeat.style.display = 'flex';
        submitBtn.style.background = '#CEAB98';
        submitBtn.innerText = '+ 確認排定課程';
    } else {
        btnSlot.style.background = '#2B3049';
        btnSlot.style.color = 'white';
        btnAppt.style.background = '#FAF6F0';
        btnAppt.style.color = '#7A736E';
        grpStudent.style.display = 'none';
        grpRepeat.style.display = 'none';
        submitBtn.style.background = '#68C5AB';
        submitBtn.innerText = '+ 確認開放自選時段';
    }
}

function submitAddModal() {
    if (!window.MusiMateDB) return;
    const dateVal = document.getElementById('modalDate').value;
    const startTimeVal = document.getElementById('modalStartTime').value;
    const endTimeVal = document.getElementById('modalEndTime').value;
    const loc = document.getElementById('modalLocation').value || '音符琴房 A303';

    if (!dateVal || !startTimeVal || !endTimeVal) {
        alert('請完整填寫日期與時間！');
        return;
    }

    const startIso = `${dateVal}T${startTimeVal}:00+08:00`;
    const endIso = `${dateVal}T${endTimeVal}:00+08:00`;

    if (currentAddModalTab === 'appointment') {
        const studentId = document.getElementById('modalStudent').value;
        const repeatCount = parseInt(document.getElementById('modalRepeatCount').value || '1', 10);
        
        window.MusiMateDB.addAppointment({
            student_id: studentId,
            start_date: dateVal,
            start_time: startTimeVal,
            end_time: endTimeVal,
            repeat_weeks: repeatCount,
            location: loc
        });
        alert(`🎉 成功排定課程！\n已為學生安排 ${repeatCount} 堂課，資料庫已自動更新並同步。`);
    } else {
        window.MusiMateDB.addOpenSlot({
            start_time: startIso,
            end_time: endIso,
            location: loc
        });
        alert(`✨ 成功開放預約時段！\n時段已公佈至學生端選課池。`);
    }

    closeAddSlotModal();
    renderTimetable();
}

function quickAddSlotForDay(dateStr, blockKey) {
    openAddSlotModal(dateStr, blockKey);
}

function quickBookForOpenSlot(startIso, endIso, loc) {
    const d = new Date(startIso);
    openAddSlotModal(formatDateISO(d), getTimeBlockKey(startIso));
    document.getElementById('modalStartTime').value = d.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
    document.getElementById('modalEndTime').value = new Date(endIso).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
    document.getElementById('modalLocation').value = loc || '音符琴房 A303';
}

function focusQuickAdd() {
    openAddSlotModal();
}

// 監聽 Firebase 雲端即時同步 (當學生請假、調課、或新學員綁定時即時自動更新課表)
window.addEventListener('musimate_db_synced', () => {
    console.log('⚡ [老師端] 收到雲端即時資料推播，自動刷新課表！');
    populateStudentDropdown();
    renderTimetable();
});

document.addEventListener('DOMContentLoaded', () => {
    populateStudentDropdown();
    renderTimetable();
});
</script>
