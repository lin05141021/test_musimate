<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>張芷嫣老師 (手機版) - MusiMate</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="mobole_styles.css">
</head>
<body>

<div class="mobile-frame">
    <!-- 1. 狀態列 -->
    <div class="status-bar">
        <span>9:41</span>
        <span>📶 🔋</span>
    </div>

    <!-- 2. 導航列 -->
    <div class="mobile-nav-header">
        <a href="new_class.html" class="mobile-logo">
            <div class="mobile-logo-icon">🎵</div>
            <span>MusiMate</span>
        </a>
        <div style="width: 36px; height: 36px; border-radius: 50%; background: #F0EAE1; display: flex; align-items: center; justify-content: center; font-size: 16px;">
            👤
        </div>
    </div>

    <!-- 3. 主內容 -->
    <div class="mobile-content">
        <!-- 徽章 -->
        <div style="display: flex; justify-content: center;">
            <div style="padding: 6px 14px; background: rgba(77, 173, 184, 0.10); border-radius: 20px; color: #4DADB8; font-size: 11px; font-weight: 700;">
                ✦ PIANO MATE 指導師資
            </div>
        </div>

        <!-- 老師基本卡片 (動態載入) -->
        <div style="background: white; border-radius: 24px; padding: 20px; box-shadow: 0 4px 16px rgba(44, 42, 41, 0.04); display: flex; gap: 16px; align-items: center;">
            <img id="mobileTeacherAvatar" src="../../UI/teacher_avatar.png" style="width: 80px; height: 80px; border-radius: 20px; object-fit: cover; border: 2px solid #CEAB98;" alt="教師照片" onerror="this.src='../../UI/teacher_avatar.png'" />
            <div style="display: flex; flex-direction: column; gap: 6px;">
                <div id="mobileTeacherName" style="color: #2B3049; font-size: 22px; font-family: 'Noto Serif TC', serif; font-weight: 700;">張芷嫣</div>
                <div id="mobileTeacherTags" style="display: flex; flex-wrap: wrap; gap: 6px;">
                    <span style="padding: 3px 8px; background: rgba(181, 142, 190, 0.2); border-radius: 8px; color: #7B1FA2; font-size: 11px; font-weight: 600;">伴奏鋼琴</span>
                    <span style="padding: 3px 8px; background: rgba(181, 142, 190, 0.2); border-radius: 8px; color: #7B1FA2; font-size: 11px; font-weight: 600;">音樂理論</span>
                </div>
            </div>
        </div>

        <!-- 經歷說明卡片 -->
        <div class="mobile-card">
            <div id="mobileTeacherBio" style="color: #4A3A31; font-size: 14px; line-height: 1.65; font-weight: 500;">
                國立師大音樂系碩士，主修鋼琴，副修豎笛。<br><br>
                音樂教學資歷 10 年，培養超過 30 位學生錄取音樂專班與國內外音樂比賽。<br><br>
                曾擔任國內多所音樂廳特約首席伴奏，擅長深入剖析聲部對位與情感流動。
            </div>
            <div style="border-top: 1px solid #F0EAE1; padding-top: 12px; display: flex; justify-content: space-between; align-items: center;">
                <span style="color: #B58EBE; font-size: 13px; font-weight: 700;">社群關注</span>
                <div style="display: flex; gap: 8px;">
                    <div style="width: 32px; height: 32px; border-radius: 50%; background: rgba(181, 142, 190, 0.2); display: flex; align-items: center; justify-content: center; font-size: 14px;">📷</div>
                    <div style="width: 32px; height: 32px; border-radius: 50%; background: rgba(181, 142, 190, 0.2); display: flex; align-items: center; justify-content: center; font-size: 14px;">📘</div>
                    <div style="width: 32px; height: 32px; border-radius: 50%; background: rgba(181, 142, 190, 0.2); display: flex; align-items: center; justify-content: center; font-size: 14px;">▶️</div>
                </div>
            </div>
        </div>

        <!-- 立即預約按鈕 -->
        <a href="../newclass/newstudent_newclass.html" class="mobile-btn-primary">
            立即免費預約試上體驗
        </a>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('musimate_teacher_profile');
    if (saved) {
        try {
            const p = JSON.parse(saved);
            if (p.name) document.getElementById('mobileTeacherName').innerText = p.name;
            if (p.avatar) document.getElementById('mobileTeacherAvatar').src = p.avatar;
            if (p.bio) document.getElementById('mobileTeacherBio').innerText = p.bio;
            if (Array.isArray(p.tags) && p.tags.length > 0) {
                document.getElementById('mobileTeacherTags').innerHTML = p.tags.map(t => 
                    `<span style="padding: 3px 8px; background: rgba(181, 142, 190, 0.2); border-radius: 8px; color: #7B1FA2; font-size: 11px; font-weight: 600;">${t}</span>`
                ).join('');
            }
        } catch(e) {}
    }
});
</script>
</body>
</html>
